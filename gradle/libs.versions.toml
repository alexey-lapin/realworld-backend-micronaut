[versions]
micronaut = "5.2.2"
micronaut-gradle-plugin = "5.0.2"

[libraries]
bcrypt = { group = "at.favre.lib", name = "bcrypt", version = "0.10.2" }
# renovate hint
micronaut-platform = { module = "io.micronaut.platform:micronaut-platform", version.ref = "micronaut" }
gradle-plugin-micronaut = { group = "io.micronaut.gradle", name = "micronaut-platform-catalog-plugin", version.ref = "micronaut-gradle-plugin" }
gradle-plugin-release = { group = "pl.allegro.tech.build", name = "axion-release-plugin", version = "1.21.4" }
gradle-plugin-spotless = { group = "com.diffplug.spotless", name = "spotless-plugin-gradle", version = "8.10.4" }

[plugins]
git-properties = { id = "com.gorylenko.gradle-git-properties", version = "2.5.7" }
micronaut-application = { id = "io.micronaut.application", version.ref = "micronaut-gradle-plugin" }
micronaut-library = { id = "io.micronaut.library", version.ref = "micronaut-gradle-plugin" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
versions = { id = "io.github.ben-manes.versions", version = "0.65.0" }
