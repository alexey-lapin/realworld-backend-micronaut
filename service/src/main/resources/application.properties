micronaut.application.name=realworld-backend-micronaut

micronaut.server.host=${HOST:0.0.0.0}
micronaut.server.port=${PORT:8080}
micronaut.server.cors.enabled=true
micronaut.server.thread-selection=AUTO

micronaut.security.enabled=true
micronaut.security.token.jwt.signatures.secret.generator.secret=MWY1MmQ2NTItODIxNC00ZGM0LWFiODQtOGFiNGZmMjlhZjdj
micronaut.security.token.jwt.signatures.secret.generator.base64=true
micronaut.security.token.jwt.signatures.secret.generator.jws-algorithm=HS256
micronaut.security.token.generator.access-token.expiration=2147483647

micronaut.security.intercept-url-map[0].pattern=/**
micronaut.security.intercept-url-map[0].http-method=OPTIONS
micronaut.security.intercept-url-map[0].access[0]=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/swagger/**
micronaut.security.intercept-url-map[1].http-method=GET
micronaut.security.intercept-url-map[1].access[0]=isAnonymous()
micronaut.security.intercept-url-map[2].pattern=/swagger-ui/**
micronaut.security.intercept-url-map[2].http-method=GET
micronaut.security.intercept-url-map[2].access[0]=isAnonymous()
micronaut.security.intercept-url-map[3].pattern=${api.version}/articles/feed
micronaut.security.intercept-url-map[3].http-method=GET
micronaut.security.intercept-url-map[3].access[0]=isAuthenticated()
micronaut.security.intercept-url-map[4].pattern=${api.version}/users/**
micronaut.security.intercept-url-map[4].http-method=POST
micronaut.security.intercept-url-map[4].access[0]=isAnonymous()
micronaut.security.intercept-url-map[5].pattern=${api.version}/articles/**
micronaut.security.intercept-url-map[5].http-method=GET
micronaut.security.intercept-url-map[5].access[0]=isAnonymous()
micronaut.security.intercept-url-map[6].pattern=${api.version}/profiles/**
micronaut.security.intercept-url-map[6].http-method=GET
micronaut.security.intercept-url-map[6].access[0]=isAnonymous()
micronaut.security.intercept-url-map[7].pattern=${api.version}/tags/**
micronaut.security.intercept-url-map[7].http-method=GET
micronaut.security.intercept-url-map[7].access[0]=isAnonymous()
micronaut.security.intercept-url-map[8].pattern=${api.version}/**
micronaut.security.intercept-url-map[8].access[0]=isAuthenticated()

micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger-ui.paths=classpath:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**

datasources.default.url=jdbc:h2:mem:devDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
datasources.default.driver-class-name=org.h2.Driver
datasources.default.username=sa
datasources.default.password=
datasources.default.schema-generate=NONE
datasources.default.dialect=H2

jpa.default.compile-time-hibernate-proxies=true
jpa.default.properties.hibernate.hbm2ddl.auto=none
jpa.default.properties.hibernate.bytecode.provider=none

jackson.serialization-inclusion=always
jackson.serialization.fail-on-empty-beans=false
# Jackson 3 moved WRITE_DATES_AS_TIMESTAMPS from SerializationFeature to DateTimeFeature
jackson.date-time-features.write-dates-as-timestamps=false

endpoints.info.enabled=true
endpoints.info.sensitive=false
endpoints.health.enabled=true
endpoints.health.sensitive=false
endpoints.health.details-visible=ANONYMOUS
endpoints.health.jdbc.enabled=true
endpoints.health.discovery-client.enabled=false
endpoints.health.disk-space.enabled=false
endpoints.loggers.enabled=true
endpoints.loggers.sensitive=false
endpoints.prometheus.enabled=true
endpoints.prometheus.sensitive=false
endpoints.routes.enabled=true
endpoints.routes.sensitive=false

api.version=/api

liquibase.enabled=true
liquibase.datasources.default.change-log=classpath:db/database-changelog.xml
